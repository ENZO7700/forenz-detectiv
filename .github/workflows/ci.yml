name: CI

# GitHub-hosted runners currently fail immediately (billing lock, 0 steps, no runner).
# Auto-run on push/PR posts a red check even though Vercel and the local gate pass.
# Re-enable `push` / `pull_request` after billing is unlocked (docs/REMAINING_BACKLOG.md RB-01).
# Local / Cloud Agent gate: npm test && npm run lint && npm run typecheck && npm run build
on:
  workflow_dispatch:

jobs:
  check:
    name: test-lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # Silent fallbacks — CI must not require real secrets
          VITE_SENTRY_DSN: ""
          VITE_POSTHOG_KEY: ""
